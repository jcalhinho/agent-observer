[package]
name = "repowatcher-agent-observer"
version = "0.13.4"
description = "Local observability for coding-agent sessions"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
chrono.workspace = true
session-events = { path = "../../../crates/session-events" }
serde.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["net"] }
serde_json = "1"
uuid.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
sha2.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
