# Updates the Homebrew cask in your tap when a release is published.
#
# Off until this secret is set:
#   HOMEBREW_TAP_TOKEN   a fine-grained token with "Contents: read and write" on the tap repository only
# The tap is <owner>/homebrew-tap unless the repository variable HOMEBREW_TAP_REPO names another one.
# The cask itself is the agent-observer.rb the release workflow attaches to each release; this
# workflow copies it to Casks/agent-observer.rb in the tap. Then:
#   brew install --cask <owner>/tap/agent-observer
#
# It runs when a release goes from draft to published (pre-releases are skipped), or by hand for a tag.

name: Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the tap (for example v0.14.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  tap:
    name: Update the cask
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Copy agent-observer.rb to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || format('{0}/homebrew-tap', github.repository_owner) }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set: the tap is not updated."
            exit 0
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a release tag: $TAG"; exit 1; }
          [[ "$TAP_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::Not owner/repo: $TAP_REPO"; exit 1; }

          work="$RUNNER_TEMP/tap"
          gh release download "$TAG" --pattern agent-observer.rb --dir "$RUNNER_TEMP"
          grep -q "version \"${TAG#v}\"" "$RUNNER_TEMP/agent-observer.rb" || { echo "::error::agent-observer.rb is not for $TAG."; exit 1; }

          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "$work"
          mkdir -p "$work/Casks"
          cp "$RUNNER_TEMP/agent-observer.rb" "$work/Casks/agent-observer.rb"
          cd "$work"
          if git diff --quiet -- Casks/agent-observer.rb && git ls-files --error-unmatch Casks/agent-observer.rb > /dev/null 2>&1; then
            echo "The tap already has this cask."
            exit 0
          fi
          git add Casks/agent-observer.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "agent-observer ${TAG#v}"
          git push origin HEAD
          echo "Published agent-observer ${TAG#v} to ${TAP_REPO}."
