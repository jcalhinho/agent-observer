# Builds the installers for a version tag and opens a draft GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in apps/desktop/src-tauri/tauri.conf.json.
# A manual run (workflow_dispatch) builds the same installers as workflow artifacts
# without creating a release.
#
# Signing is optional and switched on by repository secrets. With none set, macOS
# builds are ad-hoc signed and Windows builds are unsigned (see README › Install).
#
# macOS — Developer ID signing (Tauri imports the certificate into a temporary keychain):
#   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD   password of that .p12
#   APPLE_SIGNING_IDENTITY       "Developer ID Application: Name (TEAMID)"
# macOS — notarization, either an App Store Connect API key (preferred):
#   APPLE_API_ISSUER             issuer id
#   APPLE_API_KEY                key id
#   APPLE_API_KEY_CONTENT        contents of AuthKey_<id>.p8
# or an Apple ID:
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
#
# Windows — Authenticode signing with a certificate file:
#   WINDOWS_CERTIFICATE           base64 of the .pfx
#   WINDOWS_CERTIFICATE_PASSWORD  password of that .pfx
#   WINDOWS_TIMESTAMP_URL         optional, defaults to DigiCert's timestamp server
# (For a cloud HSM such as Azure Trusted Signing, replace the thumbprint in the
# "Configure Windows signing" step by a bundle.windows.signCommand.)
#
# In-app updates — off until both are set (generate the pair with `npx tauri signer generate`):
#   TAURI_SIGNING_PRIVATE_KEY           secret: the private key (contents of the .key file)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  secret: its password, if it has one
#   TAURI_UPDATER_PUBKEY                repository variable (not a secret): contents of the .key.pub file
# The builds then sign their update files and the release gets a latest.json; installed apps find
# it at releases/latest/download/latest.json once the release is published.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DESKTOP_WORKSPACE: "@repo-watcher/agent-observer-desktop"

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - label: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          # The oldest supported Ubuntu runner: an AppImage only runs on systems at least as new as
          # the one it was built on.
          - label: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (1.99.1)
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Read the app version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json."
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure in-app updates
        id: updater
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::notice::No updater signing key: this build will not update itself."
            echo "config=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$PUBKEY" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but the TAURI_UPDATER_PUBKEY variable is not."
            exit 1
          fi
          config="$RUNNER_TEMP/updater.json"
          node -e '
            const [file, pubkey, repo] = process.argv.slice(1);
            require("fs").writeFileSync(file, JSON.stringify({
              bundle: { createUpdaterArtifacts: true },
              plugins: { updater: { pubkey, endpoints: [`https://github.com/${repo}/releases/latest/download/latest.json`] } }
            }));
          ' "$config" "$PUBKEY" "$GH_REPO"
          echo "Update files will be signed."
          echo "config=$config" >> "$GITHUB_OUTPUT"

      - name: Type-check and test the UI
        run: |
          npm run desktop:typecheck
          npx vitest run apps/desktop

      # ---------------------------------------------------------------- macOS

      - name: Build the macOS app and dmg
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATER_CONFIG: ${{ steps.updater.outputs.config }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Tauri reacts to these variables being set at all: drop the empty ones.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [[ -n "${!name:-}" ]] || unset "$name"
          done

          if [[ -n "${APPLE_CERTIFICATE:-}" ]]; then
            if [[ -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
              echo "::error::APPLE_CERTIFICATE is set but APPLE_SIGNING_IDENTITY is not."
              exit 1
            fi
            echo "Signing with a Developer ID certificate."
            if [[ -n "${APPLE_API_KEY_CONTENT:-}" ]]; then
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
              printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY_PATH"
              unset APPLE_API_KEY_CONTENT
              echo "Notarizing with an App Store Connect API key."
            elif [[ -n "${APPLE_ID:-}" ]]; then
              echo "Notarizing with an Apple ID."
            else
              echo "::warning::Signed but not notarized: no notarization credentials."
            fi
          else
            # No certificate: ad-hoc signature, so the app runs once Gatekeeper is told to allow it.
            unset APPLE_API_ISSUER APPLE_API_KEY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY="-"
            echo "::notice::No Apple certificate configured: building an unsigned (ad-hoc) app."
          fi

          # No update key: leave Tauri's signing variables unset rather than empty.
          [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]] || unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          updater=()
          [[ -n "$UPDATER_CONFIG" ]] && updater=(--config "$UPDATER_CONFIG")
          npm run tauri --workspace "$DESKTOP_WORKSPACE" -- build --target "$TARGET" ${updater[@]+"${updater[@]}"}

      - name: Collect the macOS installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
          VERSION: ${{ steps.version.outputs.version }}
          UPDATER_CONFIG: ${{ steps.updater.outputs.config }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(target/"$TARGET"/release/bundle/dmg/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "::error::Expected exactly one .dmg, found ${#dmgs[@]}."
            exit 1
          fi
          mkdir -p release-assets
          cp "${dmgs[0]}" "release-assets/Agent-Observer_${VERSION}_${LABEL}.dmg"
          if [[ -n "$UPDATER_CONFIG" ]]; then
            updates=(target/"$TARGET"/release/bundle/macos/*.app.tar.gz)
            if (( ${#updates[@]} != 1 )) || [[ ! -f "${updates[0]}.sig" ]]; then
              echo "::error::Expected one signed .app.tar.gz update file."
              exit 1
            fi
            cp "${updates[0]}" "release-assets/Agent-Observer_${VERSION}_${LABEL}.app.tar.gz"
            cp "${updates[0]}.sig" "release-assets/Agent-Observer_${VERSION}_${LABEL}.app.tar.gz.sig"
          fi
          ls -l release-assets

      # -------------------------------------------------------------- Windows

      - name: Configure Windows signing
        id: windows-signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::notice::No Windows certificate configured: building unsigned installers."
            "config=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item -LiteralPath $pfx
          $timestamp = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          $config = Join-Path $env:RUNNER_TEMP "windows-signing.json"
          @{ bundle = @{ windows = @{
            certificateThumbprint = $certificate.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = $timestamp
          } } } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $config -Encoding utf8
          Write-Output "Signing with certificate $($certificate.Subject)."
          "config=$config" >> $env:GITHUB_OUTPUT

      - name: Build the NSIS and MSI installers
        if: runner.os == 'Windows'
        # bash rather than pwsh: PowerShell would swallow the "--" meant for npm.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SIGNING_CONFIG: ${{ steps.windows-signing.outputs.config }}
          UPDATER_CONFIG: ${{ steps.updater.outputs.config }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # No update key: leave Tauri's signing variables unset rather than empty.
          [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]] || unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          signing=()
          [[ -n "$SIGNING_CONFIG" ]] && signing+=(--config "$SIGNING_CONFIG")
          [[ -n "$UPDATER_CONFIG" ]] && signing+=(--config "$UPDATER_CONFIG")
          npm run tauri --workspace "$DESKTOP_WORKSPACE" -- build --target "$TARGET" ${signing[@]+"${signing[@]}"}

      - name: Collect the Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
          VERSION: ${{ steps.version.outputs.version }}
          UPDATER_CONFIG: ${{ steps.updater.outputs.config }}
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "target/$env:TARGET/release/bundle"
          $setup = @(Get-ChildItem -LiteralPath (Join-Path $bundle "nsis") -Filter "*-setup.exe" -File)
          $msi = @(Get-ChildItem -LiteralPath (Join-Path $bundle "msi") -Filter "*.msi" -File)
          if ($setup.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected one NSIS setup and one MSI; found $($setup.Count) and $($msi.Count)."
          }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item -LiteralPath $setup[0].FullName -Destination "release-assets/Agent-Observer_$($env:VERSION)_$($env:LABEL)-setup.exe"
          Copy-Item -LiteralPath $msi[0].FullName -Destination "release-assets/Agent-Observer_$($env:VERSION)_$($env:LABEL).msi"
          if ($env:UPDATER_CONFIG) {
            # The updater runs the NSIS installer it downloads, after checking this signature.
            $signature = "$($setup[0].FullName).sig"
            if (-not (Test-Path -LiteralPath $signature)) { throw "The NSIS installer has no .sig update signature." }
            Copy-Item -LiteralPath $signature -Destination "release-assets/Agent-Observer_$($env:VERSION)_$($env:LABEL)-setup.exe.sig"
          }
          Get-ChildItem release-assets

      # ---------------------------------------------------------------- Linux

      - name: Build the Linux deb and AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          UPDATER_CONFIG: ${{ steps.updater.outputs.config }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # No update key: leave Tauri's signing variables unset rather than empty.
          [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]] || unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          updater=()
          [[ -n "$UPDATER_CONFIG" ]] && updater=(--config "$UPDATER_CONFIG")
          npm run tauri --workspace "$DESKTOP_WORKSPACE" -- build --target "$TARGET" ${updater[@]+"${updater[@]}"}

      - name: Collect the Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
          VERSION: ${{ steps.version.outputs.version }}
          UPDATER_CONFIG: ${{ steps.updater.outputs.config }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(target/"$TARGET"/release/bundle/deb/*.deb)
          images=(target/"$TARGET"/release/bundle/appimage/*.AppImage)
          if (( ${#debs[@]} != 1 || ${#images[@]} != 1 )); then
            echo "::error::Expected one .deb and one .AppImage; found ${#debs[@]} and ${#images[@]}."
            exit 1
          fi
          mkdir -p release-assets
          cp "${debs[0]}" "release-assets/Agent-Observer_${VERSION}_${LABEL}.deb"
          cp "${images[0]}" "release-assets/Agent-Observer_${VERSION}_${LABEL}.AppImage"
          if [[ -n "$UPDATER_CONFIG" ]]; then
            [[ -f "${images[0]}.sig" ]] || { echo "::error::The AppImage has no .sig update signature."; exit 1; }
            cp "${images[0]}.sig" "release-assets/Agent-Observer_${VERSION}_${LABEL}.AppImage.sig"
          fi
          ls -l release-assets

      # --------------------------------------------------------------- shared

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-observer-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            packaging
            tools/mcp

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-observer-*
          path: release-assets
          merge-multiple: true

      - name: Write the Homebrew cask
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sum() { sha256sum "release-assets/Agent-Observer_${VERSION}_$1.dmg" | cut -d' ' -f1; }
          bash packaging/homebrew/render-cask.sh "$VERSION" "$(sum macos-arm64)" "$(sum macos-x64)" "$GH_REPO" > release-assets/agent-observer.rb
          cat release-assets/agent-observer.rb

      - name: Write latest.json for in-app updates
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if compgen -G "release-assets/*.sig" > /dev/null; then
            bash packaging/updater/render-latest-json.sh "$VERSION" "$GH_REPO" release-assets > release-assets/latest.json
            cat release-assets/latest.json
          else
            echo "::notice::No signed update files: no latest.json, installed apps will not be offered this release."
          fi

      - name: Attach the MCP server
        run: cp tools/mcp/agent-observer-mcp.mjs release-assets/agent-observer-mcp.mjs

      - name: Write SHA-256 checksums
        working-directory: release-assets
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Install

          | Platform | File |
          | --- | --- |
          | macOS, Apple Silicon | \`Agent-Observer_${VERSION}_macos-arm64.dmg\` |
          | macOS, Intel | \`Agent-Observer_${VERSION}_macos-x64.dmg\` |
          | Windows 10/11 (per user, recommended) | \`Agent-Observer_${VERSION}_windows-x64-setup.exe\` |
          | Windows 10/11 (MSI, managed deployment) | \`Agent-Observer_${VERSION}_windows-x64.msi\` |
          | Linux x86_64 (Debian, Ubuntu) | \`Agent-Observer_${VERSION}_linux-x64.deb\` |
          | Linux x86_64 (any distribution) | \`Agent-Observer_${VERSION}_linux-x64.AppImage\` |

          On macOS or Linux, one line downloads the right file, checks it against \`SHA256SUMS.txt\` and installs it:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/main/install.sh | bash
          \`\`\`

          MCP server for your agents (read-only, Node 18+): \`agent-observer-mcp.mjs\` — see the README.

          Homebrew (experimental, unsigned app): \`agent-observer.rb\` is the cask. When the tap is set up (see the README), publishing this release copies it there; then \`brew install --cask <owner>/tap/agent-observer\`.

          Verify your download against \`SHA256SUMS.txt\`. If this build is not signed yet, see
          [how to open it on macOS and Windows](https://github.com/${GH_REPO}/blob/main/README.md#install).

          See [CHANGELOG.md](https://github.com/${GH_REPO}/blob/${TAG}/CHANGELOG.md) for the details.

          EOF

          if [[ -f release-assets/latest.json ]]; then
            printf '%s\n\n' "Already installed? This version is offered in Settings → Updates once the release is published." >> notes.md
          fi

          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: replacing its assets."
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --draft \
              --verify-tag \
              --title "Agent Observer $TAG" \
              --notes-file notes.md \
              --generate-notes \
              "${prerelease[@]}"
          fi
